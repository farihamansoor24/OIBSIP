<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Calculator - Luxury Black & Gold Edition</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
<link rel="stylesheet" href="style.css" />
 
  </head>

  <body>
    <!-- Golden Interactive Background Particles -->
    <canvas id="bgCanvas"></canvas>

    <div class="container py-4 calculator-container">
      <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6 col-sm-10">
          <div class="card calculator">
            <!-- Header -->
            <div class="card-header d-flex justify-content-between align-items-center">
              <h3 class="m-0">
                <i class="bi bi-gem"></i>
                Smart Calculator
              </h3>

              <div class="d-flex gap-2">
                <!-- Sound Toggle -->
                <button class="header-btn" id="soundBtn" title="Toggle Sound">
                  <i class="bi bi-volume-up-fill" id="soundIcon"></i>
                </button>

                <!-- History Drawer -->
                <button
                  class="header-btn"
                  data-bs-toggle="offcanvas"
                  data-bs-target="#historyPanel"
                  title="View History"
                >
                  <i class="bi bi-clock-history"></i>
                </button>

                <!-- Theme Toggle -->
                <button class="header-btn" id="themeBtn" title="Toggle Theme">
                  <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
              </div>
            </div>

            <!-- Body -->
            <div class="card-body p-4">
              <!-- Display Wrapper -->
              <div class="display-wrapper">
                <div class="display-expression" id="expression"></div>
                <input
                  type="text"
                  id="display"
                  class="form-control text-end"
                  value="0"
                  readonly
                />
              </div>

              <!-- Buttons Grid -->
              <div class="row g-2">
                <!-- Row 1 -->
                <div class="col-3">
                  <button class="calc-btn btn-clear w-100" id="clearBtn">
                    C
                  </button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-back w-100" id="backBtn">
                    <i class="bi bi-backspace-fill"></i>
                  </button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-op w-100" data-value="%">
                    %
                  </button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-op w-100" data-value="/">
                    ÷
                  </button>
                </div>

                <!-- Row 2 -->
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="7">7</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="8">8</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="9">9</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-op w-100" data-value="*">
                    ×
                  </button>
                </div>

                <!-- Row 3 -->
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="4">4</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="5">5</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="6">6</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-op w-100" data-value="-">
                    −
                  </button>
                </div>

                <!-- Row 4 -->
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="1">1</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="2">2</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value="3">3</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-op w-100" data-value="+">
                    +
                  </button>
                </div>

                <!-- Row 5 -->
                <div class="col-6">
                  <button class="calc-btn btn-num w-100" data-value="0">0</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-num w-100" data-value=".">.</button>
                </div>
                <div class="col-3">
                  <button class="calc-btn btn-equal w-100" id="equalBtn">
                    =
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Offcanvas History Panel -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="historyPanel">
      <div class="offcanvas-header">
        <h5 class="m-0 fw-bold text-gold">
          <i class="bi bi-clock-history me-2"></i>Calculation History
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>

      <div class="offcanvas-body d-flex flex-column">
        <div class="flex-grow-1 overflow-auto" id="historyList">
          <div class="text-center text-muted my-4">No history yet</div>
        </div>

        <button class="btn btn-outline-danger w-100 mt-3 fw-bold" id="clearHistory">
          <i class="bi bi-trash me-2"></i>Clear History
        </button>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>

  </body>
</html>
